name: Deploy

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  ci:
    name: Run Quality & Tests
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Hostinger VPS
    needs: ci
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TARGET_DIR: /home/moisescorchodev-carfleet/htdocs/carfleet.moisescorchodev.tech
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pdo, pdo_mysql, bcmath, zip, gd, pcntl, intl
          coverage: none

      - name: Install Composer Production Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile Assets (Vite)
        run: |
          npm ci
          npm run build

      - name: Setup SSH Agent & Known Hosts
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ env.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync Files to Server via Rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ env.SSH_PORT }}" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env*' \
            --exclude='storage/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='specs/' \
            --exclude='compose.yaml' \
            --exclude='phpunit.xml' \
            --exclude='README.md' \
            --exclude='AGENTS.md' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.TARGET_DIR }}/

      - name: Run Remote Post-Deployment Commands
        run: |
          ssh -p ${{ env.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd /home/moisescorchodev-carfleet/htdocs/carfleet.moisescorchodev.tech

            # Put application in maintenance mode if already online
            php artisan down --retry=60 || true

            # Execute pending migrations
            php artisan migrate --force

            # Ensure public storage symlink exists
            php artisan storage:link || true

            # Optimize and warm caches
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache || true
            php artisan filament:cache-components || true

            # Bring application back online
            php artisan up
          EOF
